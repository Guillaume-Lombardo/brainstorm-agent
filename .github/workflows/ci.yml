name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      containers: ${{ steps.filter.outputs.containers }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/**'
              - '.pre-commit-config.yaml'
              - 'docker-compose*.yml'
              - 'deploy/**'
              - 'examples/**'
            frontend:
              - 'frontend/**'
              - '.github/workflows/**'
            containers:
              - 'backend/Dockerfile'
              - 'backend/docker/**'
              - 'backend/pyproject.toml'
              - 'backend/uv.lock'
              - 'frontend/Dockerfile'
              - 'frontend/package.json'
              - 'frontend/pnpm-lock.yaml'
              - 'frontend/next.config.ts'
              - 'docker-compose*.yml'
              - 'deploy/**'
              - '.dockerignore'
              - '.github/workflows/**'

  quality:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true'
    defaults:
      run:
        working-directory: backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: brainstorm_test
          POSTGRES_DB: brainstorm_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brainstorm_test -d brainstorm_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://brainstorm_test@localhost:5432/brainstorm_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --group dev

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Type check
        run: uv run ty check src tests

      - name: Unit tests
        run: uv run pytest -m unit

      - name: Integration tests
        run: uv run pytest -m integration

      - name: End2end tests
        run: uv run pytest -m end2end

      - name: Full-suite coverage gate
        run: uv run pytest -m "unit or integration or end2end" --cov=src --cov-report=term-missing:skip-covered

  frontend:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Unit and component tests
        run: pnpm test

      - name: Build
        run: pnpm build

  containers:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.containers == 'true'
    runs-on: ubuntu-latest
    env:
      # Throwaway values: only interpolation and the image builds are exercised.
      BRAINSTORM_POSTGRES_PASSWORD: ci-placeholder # pragma: allowlist secret
      BRAINSTORM_JWT_SECRET: ci-placeholder # pragma: allowlist secret
      BRAINSTORM_AUTH_BRIDGE_SECRET: ci-placeholder # pragma: allowlist secret
      BRAINSTORM_AUTH_SECRET: ci-placeholder # pragma: allowlist secret
      BRAINSTORM_LLM_API_KEY: sk-ci-placeholder # pragma: allowlist secret
      BRAINSTORM_ADMIN_PASSWORD: ci-placeholder # pragma: allowlist secret
      BRAINSTORM_ADMIN_EMAIL: admin@example.com
      BRAINSTORM_PUBLIC_URL: http://localhost
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose files
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.prod.yml config -q
          docker compose -f deploy/docker-box/compose.yaml config -q

      - name: Build the docker-box stack images
        run: docker compose -f deploy/docker-box/compose.yaml build

  repository-hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v5
      - name: Install backend tooling
        run: uv sync --project backend --group dev --frozen
      # The frontend pre-commit hooks run pnpm scripts.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend tooling
        run: pnpm --dir frontend install --frozen-lockfile
      - name: Pre-commit from repository root
        run: uv run --project backend pre-commit run --all-files
