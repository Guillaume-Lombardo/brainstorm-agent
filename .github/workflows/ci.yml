name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/**'
              - '.pre-commit-config.yaml'
              - 'docker-compose*.yml'
              - 'deploy/**'
              - 'examples/**'
            frontend:
              - 'frontend/**'
              - '.github/workflows/**'

  # A future frontend job can use needs.changes.outputs.frontend.
  quality:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true'
    defaults:
      run:
        working-directory: backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --group dev

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Type check
        run: uv run ty check src tests

      - name: Unit tests
        run: uv run pytest -m unit

      - name: Integration tests
        run: uv run pytest -m integration

      - name: End2end tests
        run: uv run pytest -m end2end

      - name: Full-suite coverage gate
        run: uv run pytest -m "unit or integration or end2end" --cov=src --cov-report=term-missing:skip-covered

  repository-hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v5
      - name: Install backend tooling
        run: uv sync --project backend --group dev --frozen
      - name: Pre-commit from repository root
        run: uv run --project backend pre-commit run --all-files
