name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      containers: ${{ steps.filter.outputs.containers }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/**'
              - '.pre-commit-config.yaml'
              - 'docker-compose*.yml'
              - 'deploy/**'
              - 'examples/**'
            frontend:
              - 'frontend/**'
              - '.github/workflows/**'
            containers:
              - 'backend/Dockerfile'
              - 'backend/docker/**'
              - 'backend/pyproject.toml'
              - 'backend/uv.lock'
              - 'frontend/Dockerfile'
              - 'frontend/package.json'
              - 'frontend/pnpm-lock.yaml'
              - 'frontend/next.config.ts'
              - 'docker-compose*.yml'
              - 'deploy/**'
              - '.dockerignore'
              - '.github/workflows/**'

  quality:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true'
    defaults:
      run:
        working-directory: backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: brainstorm_test
          POSTGRES_DB: brainstorm_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brainstorm_test -d brainstorm_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://brainstorm_test@localhost:5432/brainstorm_test
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      - name: Setup uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Install dependencies
        run: uv sync --group dev

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Type check
        run: uv run ty check src tests

      - name: Unit tests
        run: uv run pytest -m unit

      - name: Integration tests
        run: uv run pytest -m integration

      - name: End2end tests
        run: uv run pytest -m end2end

      - name: Full-suite coverage gate
        run: uv run pytest -m "unit or integration or end2end" --cov=src --cov-report=term-missing:skip-covered

  frontend:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Unit and component tests
        run: pnpm test

      - name: Build
        run: pnpm build

  frontend-e2e:
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.backend == 'true'
    defaults:
      run:
        working-directory: frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      - name: Setup uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Install backend
        working-directory: backend
        run: uv sync --frozen

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Production build against the real backend: fake LLM, SQLite, JWT and login bridge.
      - name: End-to-end tests
        run: pnpm e2e

      - name: Upload screenshots and traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-e2e
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14

  containers:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.containers == 'true'
    runs-on: ubuntu-latest
    env:
      # Throwaway values: only interpolation and the image builds are exercised.
      BRAINSTORM_POSTGRES_PASSWORD: ci-placeholder # pragma: allowlist secret
      BRAINSTORM_JWT_SECRET: ci-placeholder # pragma: allowlist secret
      BRAINSTORM_AUTH_BRIDGE_SECRET: ci-placeholder # pragma: allowlist secret
      BRAINSTORM_AUTH_SECRET: ci-placeholder # pragma: allowlist secret
      BRAINSTORM_LLM_API_KEY: sk-ci-placeholder # pragma: allowlist secret
      BRAINSTORM_SEARXNG_SECRET: ci-placeholder # pragma: allowlist secret
      BRAINSTORM_ADMIN_PASSWORD: ci-placeholder # pragma: allowlist secret
      BRAINSTORM_ADMIN_EMAIL: admin@example.com
      BRAINSTORM_PUBLIC_URL: http://localhost
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Validate Compose files
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.prod.yml config -q
          docker compose -f deploy/docker-box/compose.yaml config -q

      - name: Build the docker-box stack images
        run: docker compose -f deploy/docker-box/compose.yaml build

  repository-hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - name: Install backend tooling
        run: uv sync --project backend --group dev --frozen
      # The frontend pre-commit hooks run pnpm scripts.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend tooling
        run: pnpm --dir frontend install --frozen-lockfile
      - name: Pre-commit from repository root
        run: uv run --project backend pre-commit run --all-files
