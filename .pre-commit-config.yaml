repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        # The README demo recording is the only binary allowed above 500 kB.
        exclude: ^docs/assets/demo\.(gif|mp4)$
      - id: check-merge-conflict
      - id: check-ast
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-symlinks
      - id: check-yaml
        exclude: ^frontend/pnpm-lock\.yaml$
      - id: check-toml
      - id: debug-statements
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: no-commit-to-branch
        args: [--branch, main, --branch, master, --branch, staging-stable]
      - id: pretty-format-json
        exclude: "^.*ipynb$"
        args:
          - --autofix
      - id: trailing-whitespace
        exclude: '^.*\.patch$'
        args: [--markdown-linebreak-ext=md]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.0
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        exclude: ^frontend/pnpm-lock\.yaml$

  - repo: https://github.com/AleksaC/hadolint-py
    rev: v2.15.1
    hooks:
      - id: hadolint
        files: (^|/)Dockerfile$

  - repo: local
    hooks:
      - id: ty
        name: ty (type checking)
        entry: uv run --directory backend ty check src/ tests/
        language: system
        pass_filenames: false
        files: ^backend/
      - id: pytest-unit
        name: pytest unit
        entry: uv run --directory backend pytest -m unit
        language: system
        pass_filenames: false
        files: ^backend/
      - id: frontend-format
        name: frontend prettier
        entry: pnpm --dir frontend format:check
        language: system
        pass_filenames: false
        files: ^frontend/
      - id: frontend-lint
        name: frontend eslint
        entry: pnpm --dir frontend lint
        language: system
        pass_filenames: false
        files: ^frontend/
      - id: frontend-typecheck
        name: frontend typecheck
        entry: pnpm --dir frontend typecheck
        language: system
        pass_filenames: false
        files: ^frontend/
      - id: frontend-test
        name: frontend vitest
        entry: pnpm --dir frontend test
        language: system
        pass_filenames: false
        files: ^frontend/
